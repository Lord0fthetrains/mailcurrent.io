{% extends 'base.html' %}

{% block title %}Reset Password - MailCurrent.io{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-key text-primary" style="font-size: 3rem;"></i>
                        <h2 class="mt-3 mb-2">Reset Your Password</h2>
                        <p class="text-muted">Enter your new password below.</p>
                    </div>

                    <div id="alertContainer">
                        {% if message %}
                        <div class="alert alert-{{ message_type|default:'info' }} alert-dismissible fade show">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endif %}
                    </div>

                    <form id="resetPasswordForm">
                        {% csrf_token %}
                        <input type="hidden" id="token" value="{{ token }}">
                        
                        <div class="mb-4">
                            <label for="new_password" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="new_password" name="new_password" required 
                                   placeholder="Enter your new password" minlength="8">
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required 
                                   placeholder="Confirm your new password" minlength="8">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="bi bi-check-circle me-2"></i>Reset Password
                        </button>
                    </form>

                    <div class="text-center">
                        <p class="mb-0">
                            Remember your password? 
                            <a href="{% url 'login' %}" class="text-decoration-none">Sign in</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('resetPasswordForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const token = document.getElementById('token').value;
    
    if (newPassword !== confirmPassword) {
        showAlert('Passwords do not match!', 'danger');
        return;
    }
    
    if (newPassword.length < 8) {
        showAlert('Password must be at least 8 characters long!', 'danger');
        return;
    }
    
    const formData = new FormData();
    formData.append('new_password', newPassword);
    formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);
    
    try {
        const response = await fetch(`/api/v1/accounts/reset-password/${token}/`, {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (response.ok) {
            showAlert('Password reset successfully! You can now sign in with your new password.', 'success');
            setTimeout(() => {
                window.location.href = '{% url "login" %}';
            }, 2000);
        } else {
            showAlert('Error: ' + (result.message || 'Failed to reset password'), 'danger');
        }
    } catch (error) {
        console.error('Error:', error);
        showAlert('Error resetting password. Please try again.', 'danger');
    }
});

function showAlert(message, type) {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
    alertDiv.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    `;
    document.getElementById('alertContainer').appendChild(alertDiv);

    setTimeout(() => {
        const alert = bootstrap.Alert.getInstance(alertDiv);
        if (alert) alert.close();
    }, 5000);
}
</script>
{% endblock %}
