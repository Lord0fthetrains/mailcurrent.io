{% extends 'base.html' %}

{% block title %}Verification Expired - MailCurrent.io{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg">
                <div class="card-body text-center p-5">
                    <div class="mb-4">
                        <i class="bi bi-clock-history text-warning" style="font-size: 4rem;"></i>
                    </div>
                    <h2 class="fw-bold text-warning mb-3">Verification Link Expired</h2>
                    <p class="text-muted mb-4">{{ message }}</p>
                    <p class="text-muted mb-4">Please request a new verification email to continue.</p>
                    <div class="d-grid gap-2">
                        <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                            <i class="bi bi-envelope me-2"></i>Request New Verification Email
                        </a>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-house me-2"></i>Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
