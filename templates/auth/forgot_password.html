{% extends 'base.html' %}

{% block title %}Forgot Password - MailCurrent.io{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                        <h2 class="mt-3 mb-2">Forgot Password?</h2>
                        <p class="text-muted">Enter your email address and we'll send you a link to reset your password.</p>
                    </div>

                    <div id="alertContainer"></div>

                    <form id="forgotPasswordForm">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" required 
                                   placeholder="Enter your email address">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="bi bi-envelope me-2"></i>Send Reset Link
                        </button>
                    </form>

                    <div class="text-center">
                        <p class="mb-0">
                            Remember your password? 
                            <a href="{% url 'login' %}" class="text-decoration-none">Sign in</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('forgotPasswordForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    
    const email = document.getElementById('email').value;
    const formData = new FormData();
    formData.append('email', email);
    formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);
    
    try {
        const response = await fetch('/api/v1/accounts/request-password-reset/', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (response.ok) {
            showAlert('Password reset link sent! Please check your email.', 'success');
            document.getElementById('forgotPasswordForm').reset();
        } else {
            showAlert('Error: ' + (result.message || 'Failed to send reset link'), 'danger');
        }
    } catch (error) {
        console.error('Error:', error);
        showAlert('Error sending reset link. Please try again.', 'danger');
    }
});

function showAlert(message, type) {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
    alertDiv.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    `;
    document.getElementById('alertContainer').appendChild(alertDiv);

    setTimeout(() => {
        const alert = bootstrap.Alert.getInstance(alertDiv);
        if (alert) alert.close();
    }, 5000);
}
</script>
{% endblock %}
